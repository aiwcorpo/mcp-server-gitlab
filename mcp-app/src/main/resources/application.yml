# Base configuration is the production one: mTLS from the gateway, internal JWT, jti store in Redis.
# Everything that differs per environment comes from environment variables (README, "Konfiguracja").
# The 'dev' profile (tests, see application-dev.yml) only turns off TLS; the remaining development
# relaxations come from TestGateway and the starter refuses them outside 'dev'.
server:
  port: ${MCP_PORT:8443}
  address: ${MCP_BIND:0.0.0.0}

spring:
  application:
    name: mcp-gitlab
  data:
    redis:
      host: ${MCP_REDIS_HOST:localhost}
      port: ${MCP_REDIS_PORT:6379}
      username: ${MCP_REDIS_USER:mcp-gitlab}
      password: ${MCP_REDIS_PASSWORD:}
  ai:
    mcp:
      server:
        # Transport (streamable HTTP, SYNC, endpoint /mcp) is defaulted by the starter.
        name: mcp-gitlab
        version: '@project.version@'

aiwcorpo:
  mcp:
    platform:
      server-id: mcp-gitlab
      internal-jwt:
        issuer: ${MCP_GATEWAY_ISSUER:https://mcp-gateway.internal}
        jwks-uri: ${MCP_GATEWAY_JWKS_URI:}
      credential:
        connect-url: ${MCP_CONNECT_URL:}
      # The signed policy bundle (C7), the same one the gateway evaluates. The server does not start without a first
      # bundle, and state-dir keeps the last accepted revision across restarts so an older signed bundle is refused.
      policy:
        main:
          url: ${MCP_POLICY_URL:}
          key-id: ${MCP_POLICY_KEY_ID:}
          public-key-file: ${MCP_POLICY_PUBLIC_KEY_FILE:}
        state-dir: ${MCP_POLICY_STATE_DIR:}
      # Description of this server for the registry (GET /mcp-manifest, C6); the tool entries come from the code.
      manifest:
        version: '@project.version@'
        internal-url: ${MCP_INTERNAL_URL:}
        # The first type is the default of the system (context.credentialType in every Cedar request) and the one the
        # gateway resolves for GitLab: OAuth. A personal access token is accepted too. A request whose
        # X-MCP-Credential-Type is outside this list is refused by the starter (internal_error).
        accepted-credential-types: ${MCP_ACCEPTED_CREDENTIAL_TYPES:user-oauth,user-secret}
      # HMAC key of the paging cursors (Base64, at least 32 bytes). Every instance behind the gateway must have the
      # same one; without it each instance draws its own and a cursor issued by another instance is refused.
      paging:
        cursor-key: ${MCP_PAGING_CURSOR_KEY:}

gitlab:
  backend:
    base-url: ${MCP_GITLAB_URL:}
    ssl-bundle: ${MCP_GITLAB_SSL_BUNDLE:}
    connect-timeout: 2s
    read-timeout: 10s
    max-response-size: 1MB
    # Lists and single objects come back with full descriptions and diffs; every text is cut to its own limit after reading.
    max-json-size: ${MCP_GITLAB_MAX_JSON_SIZE:8MB}
    # GitLab cannot return only the end of a job log, so get_job_log reads the whole log (up to this size) to cut it.
    max-log-size: ${MCP_GITLAB_MAX_LOG_SIZE:8MB}
    # Plain http outside 'dev' only for the mocks of the dev stack; never in a real deployment.
    allow-plain-http: ${MCP_GITLAB_ALLOW_PLAIN_HTTP:false}
  files:
    # Larger files are refused without reading their content (get_file).
    max-bytes: ${MCP_GITLAB_FILE_MAX_BYTES:262144}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mcp-gitlab

---
# TLS outside 'dev'. The server ends mTLS itself: the gateway must present a certificate of the internal CA
# (the starter also checks its CN), and the gateway checks this server's SAN mcp-gitlab.internal.
spring:
  config:
    activate:
      on-profile: "!dev"
  ssl:
    bundle:
      jks:
        mcp-server:
          keystore:
            location: file:${MCP_TLS_KEYSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
        mcp-internal-ca:
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
server:
  ssl:
    bundle: mcp-server
    client-auth: need
aiwcorpo:
  mcp:
    platform:
      internal-jwt:
        jwks-ssl-bundle: mcp-internal-ca
